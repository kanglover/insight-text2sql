<!--
  向量检索 vs 关键词检索 · 机制对比图
  用途：配 docs/retrieval-comparison.md 使用，直观展示两种检索的底层匹配流程差异。
  左：向量检索（语义匹配，编码器→向量→ANN）；右：关键词检索（词面匹配，分词+倒排→TF/IDF）。
-->
<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>向量检索与关键词检索机制对比</title>
  <desc>左侧为向量检索的语义匹配流程，右侧为关键词检索的词面匹配流程</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="200" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">向量检索 · 语义匹配</text>
  <text x="500" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">关键词检索 · 词面匹配</text>

  <g>
    <rect x="110" y="50" width="180" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="200" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#26215C">用户问题</text>
  </g>
  <g>
    <rect x="110" y="120" width="180" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="200" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#26215C">编码器 → 向量</text>
  </g>
  <g>
    <rect x="110" y="190" width="180" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="200" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#26215C">向量库 ANN 检索</text>
  </g>

  <g>
    <rect x="410" y="50" width="180" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="500" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#04342C">用户问题</text>
  </g>
  <g>
    <rect x="410" y="120" width="180" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="500" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#04342C">分词 + 倒排索引</text>
  </g>
  <g>
    <rect x="410" y="190" width="180" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="500" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" fill="#04342C">TF / IDF 打分</text>
  </g>

  <path d="M200 90 L200 120" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M200 160 L200 190" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M500 90 L500 120" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <path d="M500 160 L500 190" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <text x="200" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">优：同义/语义模糊匹配</text>
  <text x="200" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3C3489">缺：需模型·黑盒·冷启动慢</text>
  <text x="500" y="258" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">优：精确·可解释·零模型</text>
  <text x="500" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#085041">缺：同义/语义弱</text>
</svg>
