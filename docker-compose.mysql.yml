# MySQL 部署覆盖层 —— 叠加在基础 compose 之上，不改动基础文件。
#
#   演示（SQLite，零依赖）：  docker compose up -d --build
#   部署（MySQL）：           docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
#   或：                      make up-mysql
#
# 覆盖层只做三件事：
#   1. 加一个 mysql 服务（utf8mb4 + 健康探针 + 持久化卷）；
#   2. 把 backend 的 DATABASE_URL 换成 MySQL；
#   3. 让 backend 等 MySQL 真正可连再启动，避免启动竞态。
#
# ⚠️ 改了 MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE，必须同步改 DATABASE_URL。
#    compose 不支持在默认值里嵌套引用变量，两者不会自动联动。

services:
  mysql:
    image: mysql:8.0
    container_name: insight-mysql
    command:
      # 中文与 emoji 必须 utf8mb4（MySQL 的 utf8 是三字节的 utf8mb3，存不下 emoji）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 让 NOW() 与时区一致，避免 created_at 差 8 小时
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Insight_Root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insight}
      MYSQL_USER: ${MYSQL_USER:-insight}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Insight_2026}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - insight-mysql:/var/lib/mysql
      # 首次初始化时执行建库语句；数据卷非空时不会再跑
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ 是转义：compose 不会替换它，由容器内 shell 去取真实环境变量，
      # 这样改了 MYSQL_ROOT_PASSWORD 也不需要同步改这里
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  backend:
    environment:
      # 连接串必须带 charset=utf8mb4，否则中文可能展示成问号
      DATABASE_URL: ${DATABASE_URL:-mysql+aiomysql://insight:Insight_2026@mysql:3306/insight?charset=utf8mb4}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  insight-mysql:
