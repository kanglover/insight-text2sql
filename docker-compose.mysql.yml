# MySQL 部署覆盖层 —— 叠加在基础 compose 之上，不改动基础文件。
#
#   演示（SQLite，零依赖）：  docker compose up -d --build
#   部署（MySQL）：           docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
#   或：                      make up-mysql
#
# 覆盖层只做三件事：
#   1. 加一个 mysql 服务（utf8mb4 + 健康探针 + 持久化卷）；
#   2. 把 backend 的 DATABASE_URL 换成 MySQL；
#   3. 让 backend 等 MySQL 真正可连再启动，避免启动竞态。
#
# ⚠️ 改了 MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE，必须同步改 DATABASE_URL。
#    compose 不支持在默认值里嵌套引用变量，两者不会自动联动。

services:
  mysql:
    image: mysql:8.0
    container_name: insight-mysql
    command:
      # 中文与 emoji 必须 utf8mb4（MySQL 的 utf8 是三字节的 utf8mb3，存不下 emoji）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 让 NOW() 与时区一致，避免 created_at 差 8 小时
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Insight_Root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-insight}
      MYSQL_USER: ${MYSQL_USER:-insight}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Insight_2026}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - insight-mysql:/var/lib/mysql
      # 首次初始化时执行建库语句；数据卷非空时不会再跑
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ 是转义：compose 不会替换它，由容器内 shell 去取真实环境变量，
      # 这样改了 MYSQL_ROOT_PASSWORD 也不需要同步改这里
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    ports:
      # 把 MySQL 发布到宿主机，方便用本地客户端 / 本地应用连接。
      # 注意：你另一套 mysql 容器已占用宿主机 3306，这里改用 13306 避免冲突。
      - "13306:3306"

  backend:
    environment:
      # 组件式：只把 host 换成 mysql 服务名，其余账号/库名沿用根 .env 的 MYSQL_* 变量。
      # 这样本地 / 容器 / 生产三套环境只用改 DB_HOST（127.0.0.1 / mysql / 云库域名），
      # 不再需要把整串写死，也不会被 .env 里的地址覆盖。
      # 部署到外部 MySQL 时不带本覆盖层，改用 --env-file deploy.env 注入 DB_HOST 即可。
      DB_HOST: mysql
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${MYSQL_USER:-insight}
      DB_PASSWORD: ${MYSQL_PASSWORD:-Insight_2026}
      DB_NAME: ${MYSQL_DATABASE:-insight}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  insight-mysql:
