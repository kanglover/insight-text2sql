name: CI/CD — Build, Test & Deploy

# 触发：
#   1) push 到 main 分支 → 自动 测试 → 构建镜像 → 部署到服务器（默认 MySQL 配置）
#   2) 手动 workflow_dispatch → 可选 db_profile: mysql / sqlite
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      db_profile:
        description: "数据库配置：mysql（生产，默认）或 sqlite（零依赖演示）"
        required: true
        default: "mysql"
        type: choice
        options:
          - mysql
          - sqlite

# 读取仓库源码需要读权限（镜像推送到腾讯云 CCR，不再用 GitHub Packages）
permissions:
  contents: read

env:
  # 镜像仓库：Docker Hub（境外 runner 推送快、服务器可拉取），账号来自 GitHub Secrets，不硬编码
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_BACKEND: ${{ secrets.DOCKERHUB_USERNAME }}/insight-text2sql-backend
  IMAGE_FRONTEND: ${{ secrets.DOCKERHUB_USERNAME }}/insight-text2sql-frontend

jobs:
  # ---------------------------------------------------------------- 测试
  test-backend:
    name: 后端单测 + 风格检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 安装依赖与测试工具
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff
      - name: 代码风格检查（ruff）
        run: python -m ruff check .
      - name: 运行单测（内存 SQLite，不落盘）
        run: python -m pytest -q

  test-frontend:
    name: 前端类型检查 + 生产构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 类型检查 + 生产构建
        run: npm run build

  # ---------------------------------------------------------------- 构建并推送镜像
  build-and-push:
    name: 构建并推送镜像到 Docker Hub
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_BACKEND }}:latest
      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_FRONTEND }}:latest

  # ---------------------------------------------------------------- 部署到服务器
  deploy:
    name: 部署到服务器
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DB_PROFILE: ${{ github.event.inputs.db_profile || 'mysql' }}
    steps:
      - uses: actions/checkout@v4

      - name: 在服务器创建部署目录
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /opt/insight-text2sql
            sudo chown $USER:$USER /opt/insight-text2sql

      - name: 复制部署文件（compose + mysql 初始化脚本）
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy"
          target: "/opt/insight-text2sql"
          strip_components: 0

      - name: 远程拉取镜像并重启服务
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PROFILE: ${{ env.DB_PROFILE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_PROFILE,IMAGE_TAG,DOCKERHUB_USERNAME
          script: |
            set -e
            cd /opt/insight-text2sql

            # 服务器必须已有 .env（含 LLM_API_KEY / MYSQL_PASSWORD 等密钥），由你手动维护，不会被覆盖
            if [ ! -f .env ]; then
              echo "❌ 服务器缺少 /opt/insight-text2sql/.env，请先按说明创建后再部署"
              exit 1
            fi

            # 配置 Docker Hub 国内加速镜像（腾讯云 / DaoCloud / 163 多备）
            # 让服务器经国内节点拉取，避免直连 registry-1.docker.io 超时。
            # 重要：docker login 永远直连 registry-1.docker.io，在中国服务器上必然超时，
            #       因此本流程要求 Docker Hub 仓库设为【公开】，公开镜像经镜像加速器即可免登录拉取。
            MIRRORS='["https://mirror.ccs.tencentyun.com","https://docker.m.daocloud.io","https://hub-mirror.c.163.com"]'
            if ! docker info 2>/dev/null | grep -q "mirror.ccs.tencentyun.com"; then
              echo "🔧 配置 Docker 镜像加速器并重启 dockerd..."
              sudo mkdir -p /etc/docker
              echo "{\"registry-mirrors\":$MIRRORS}" | sudo tee /etc/docker/daemon.json >/dev/null
              sudo systemctl restart docker 2>/dev/null || sudo service docker restart 2>/dev/null || true
              # 等待 daemon 真正就绪（最多 ~30s）
              for i in $(seq 1 15); do
                docker info >/dev/null 2>&1 && break
                sleep 2
              done
            fi
            echo "🪞 当前生效的镜像加速器："
            docker info 2>/dev/null | grep -A3 "Registry Mirrors" || true

            MYSQL_FILES=""
            if [ "$DB_PROFILE" = "mysql" ]; then
              MYSQL_FILES="-f deploy/docker-compose.prod.mysql.yml"
            fi

            # 生成自签名证书，供前端 443(HTTPS) 使用（裸 IP 无需备案/域名）。
            # 证书放在 /opt/insight-text2sql/certs，由 compose 卷挂载进前端容器。
            # 仅当证书不存在时才生成；若服务器 IP 变更，删掉该目录重跑部署即可重新生成。
            SERVER_IP="${{ secrets.SSH_HOST }}"
            mkdir -p /opt/insight-text2sql/certs
            if [ ! -f /opt/insight-text2sql/certs/fullchain.pem ]; then
              echo "🔐 生成自签名证书（CN=$SERVER_IP）..."
              openssl req -x509 -newkey rsa:2048 -nodes \
                -keyout /opt/insight-text2sql/certs/privkey.pem \
                -out /opt/insight-text2sql/certs/fullchain.pem \
                -days 3650 -subj "/CN=$SERVER_IP" \
                -addext "subjectAltName=IP:$SERVER_IP"
            else
              echo "🔐 已存在自签名证书，跳过生成"
            fi

            export INSIGHT_IMAGE_TAG="$IMAGE_TAG"
            export INSIGHT_IMAGE_BACKEND="$DOCKERHUB_USERNAME/insight-text2sql-backend"
            export INSIGHT_IMAGE_FRONTEND="$DOCKERHUB_USERNAME/insight-text2sql-frontend"
            # 注意：compose 以 -f 指定的文件所在目录（deploy/）为项目目录加载 .env，
            # 而运行时 .env 在 /opt/insight-text2sql/，必须显式 --env-file 才能读到 WEB_PORT 等。
            docker compose --env-file .env -f deploy/docker-compose.prod.yml $MYSQL_FILES pull
            docker compose --env-file .env -f deploy/docker-compose.prod.yml $MYSQL_FILES up -d
            docker image prune -f

            echo "✅ 部署完成，当前服务状态："
            docker compose --env-file .env -f deploy/docker-compose.prod.yml $MYSQL_FILES ps

