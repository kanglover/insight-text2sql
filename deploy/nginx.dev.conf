# ============================================================
# 本地开发用 nginx 配置（HTTP :80 only，不含 HTTPS）
# 镜像里打的是 deploy/nginx.conf（含 443 HTTPS，需要挂载证书），
# 但本地 docker-compose 没有挂证书卷，会导致 nginx 因找不到证书启动崩溃。
# 这里用卷挂载覆盖掉镜像内的配置，只保留 :80，本地 http://localhost:8080 即可访问。
# 生产环境仍用 deploy/nginx.conf（由 deploy/docker-compose.prod.yml 挂载证书）。
# ============================================================

server {
    listen 80;
    server_name _;

    # 让 nginx 每次请求都通过 Docker 内置 DNS 重新解析 backend 容器 IP，
    # 避免后端容器重建后 nginx 仍指向旧 IP 导致 /api 503。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "backend:8000";

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键：关闭缓冲，否则事件会攒到连接结束才一次性下发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
