server {
    listen 80;
    # 显式绑定到对外域名，同时保留裸 IP 访问（仍是默认 server，其它 Host 也能命中）
    server_name insight.kanglover.cc.cd 42.193.23.139;

    # 让 nginx 每次请求都通过 Docker 内置 DNS 重新解析 backend 容器 IP。
    # 默认 nginx 只在启动时解析一次并缓存，后端容器一旦重建（新 IP），
    # nginx 会一直指向已死的旧 IP，导致 /api/* 全部 503，直到 nginx 被 reload。
    # 用 resolver + 变量形式可彻底消除这个部署后短暂 503 的坑。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "backend:8000";

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端 history 路由：找不到文件时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 的关键三行 ----
        # 关闭缓冲，否则事件会被 nginx 攒到连接结束才一次性下发，
        # 前端就看不到「分析过程」逐步点亮的效果；
        # 同时把读超时拉长，因为一次问数要等大模型。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # 透出后端 Swagger 文档（FastAPI /docs 与 openapi 规范）
    # 注意：Swagger UI 的 JS/CSS 由 FastAPI 默认从公网 CDN 加载，访问者浏览器需可联网
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
