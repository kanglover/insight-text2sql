# 前端独立部署用的 nginx 站点配置。
#
# 与 deploy/nginx.conf 的唯一区别是反代目标：那份写死了 compose 内网服务名
# `backend:8000`，这份给「前端不在 compose 里 / 后端在另一台机器」的场景。
#
# 用法（宿主机 nginx）：
#   sudo cp deploy/nginx.standalone.conf /etc/nginx/conf.d/insight.conf
#   sudo sed -i 's|http://127.0.0.1:8000|http://你的后端地址:8000|' /etc/nginx/conf.d/insight.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 用法（独立 nginx 容器）：
#   docker run -d -p 80:80 \
#     -v $(pwd)/frontend/dist:/usr/share/nginx/html:ro \
#     -v $(pwd)/deploy/nginx.standalone.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:1.27-alpine
#   容器场景下把下面的 127.0.0.1 换成 host.docker.internal（Docker Desktop）
#   或宿主机内网 IP。

server {
    listen 80;
    # 换成实际域名
    server_name _;

    # 静态资源根目录：指向 npm run build 的产物
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端 history 路由：找不到文件时回落到 index.html
    # 少了这一行，刷新 /logs、/system/app 会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 —— ↓↓↓ 只需要改这一行的地址 ↓↓↓
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 的关键几行 ----
        # 问数走的是 Server-Sent Events（/api/chat/stream）。
        # 打开缓冲会让 nginx 攒到连接结束才一次性下发，前端就看不到
        # 「分析过程」逐步点亮的效果，表现是「卡住几十秒后突然出结果」。
        proxy_buffering off;
        proxy_cache off;
        # 一次问数要等大模型往返，超时要比后端 SQL_TIMEOUT_SECONDS 长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}
