# 一键起前后端（默认 SQLite，零外部依赖）。
#   docker compose up -d --build      首次构建并启动
#   docker compose logs -f backend    看后端日志
#   docker compose down               停止
#
# 部署到服务器要换成 MySQL 时，叠加覆盖层即可，基础文件不用改：
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
#   （或 make up-mysql）它会额外拉起 mysql 容器并把 DATABASE_URL 切过去。
#
# 默认用「规则引擎」离线跑（LLM_PROVIDER=rule），不需要任何密钥就能演示；
# 想接大模型时在项目根目录建 .env 覆盖下面的 LLM_* 变量即可。
services:
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    image: insight-text2sql-backend:1.0.0
    container_name: insight-backend
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-rule}
      LLM_MODEL: ${LLM_MODEL:-glm-4-plus}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      # 默认 SQLite；切 MySQL 时让覆盖层 / --env-file 注入 DB_HOST 即可（DB_HOST 优先级更高）。
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////data/insight.db}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-insight}
      DB_PASSWORD: ${DB_PASSWORD:-Insight_2026}
      DB_NAME: ${DB_NAME:-insight}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # 容器出网代理：Docker 内无法直接解析外部大模型域名，需经宿主机网关出网。
      # 用专用变量 BACKEND_PROXY（指向宿主机网关 IP，如 192.168.5.2:10808），避免被
      # shell 已有的 HTTPS_PROXY(127.0.0.1) 覆盖。NO_PROXY 固定保护内部 MySQL / localhost 流量。
      HTTP_PROXY: ${BACKEND_PROXY:-}
      HTTPS_PROXY: ${BACKEND_PROXY:-}
      NO_PROXY: mysql,localhost,127.0.0.1
    volumes:
      # 持久化 SQLite，容器重建后历史会话与日志还在
      - insight-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        # 留空 = 前端用同源 /api，由容器内 nginx 反代到 backend（默认，推荐，无需配 CORS）。
        # 只有前后端不同域名时才填，例如 VITE_API_BASE=https://api.example.com，
        # 同时必须把后端的 CORS_ORIGINS 指到前端域名。
        # 注意这是构建期参数，改完要 docker compose build --no-cache frontend 才生效。
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: insight-text2sql-frontend:1.0.0
    container_name: insight-frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    # 本地用 HTTP 版 nginx 配置覆盖镜像内那份（镜像内的是生产用，含 443 HTTPS 需要证书，
    # 本地没挂证书卷会崩）。生产部署走 deploy/docker-compose.prod.yml，不受影响。
    volumes:
      - ./deploy/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  insight-data:
