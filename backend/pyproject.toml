[project]
name = "insight-text2sql-backend"
version = "1.0.0"
description = "销售经管场景的 Text2SQL 问数后端（FastAPI + SQLAlchemy + 自研流水线）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# MySQL 8 默认 caching_sha2_password 认证，必须带 cryptography，否则连接直接失败
mysql = ["pymysql>=1.1", "aiomysql>=0.2", "cryptography>=42.0"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
# 测试库全部跑在内存 SQLite 上，不落盘；这里显式关掉缓存写入，
# 避免在受限环境里因为 .pytest_cache 目录权限导致整批用例失败。
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
